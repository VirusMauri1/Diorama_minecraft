[package]
name = "diorama_minecraft"
version = "0.1.0"
edition = "2021"
description = "Diorama raytracer estilo Minecraft (barco pirata en una isla flotante de cerezos, de noche) sin librerias externas"

# Sin dependencias externas: solo la libreria estandar de Rust.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 2
